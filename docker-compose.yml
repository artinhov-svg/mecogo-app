version: '3.8'

services:
  mecogo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_SUPABASE_URL=https://demo.supabase.co
      - VITE_SUPABASE_ANON_KEY=demo-key
    volumes:
      - .:/app
      - /app/node_modules

  # Optional: Local database for testing
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mecogo
      POSTGRES_USER: mecogo
      POSTGRES_PASSWORD: mecogo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
